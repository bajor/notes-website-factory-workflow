<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Reconstructed sub-pixel strokes</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <text x="240" y="36" text-anchor="middle" font-size="18" font-weight="bold">Before: untraceable = raster</text>
  <text x="720" y="36" text-anchor="middle" font-size="18" font-weight="bold">After: pen strokes reconstructed</text>
  <line x1="480" y1="20" x2="480" y2="580" stroke="#bbb" stroke-dasharray="6 4"/>

  <!-- Before -->
  <g stroke="#444" stroke-width="1.5" fill="none">
    <rect x="90" y="64" width="300" height="64" rx="8" fill="#fff7e0"/>
    <rect x="90" y="190" width="300" height="72" rx="8" fill="#eaf7ea"/>
    <path d="M240 128 V186" marker-end="url(#arrow)"/>
  </g>
  <text x="240" y="90" text-anchor="middle">Untraceable component</text>
  <text x="240" y="110" text-anchor="middle" font-size="12" fill="#555">ink below alpha 88 &gt; 25%</text>
  <text x="240" y="216" text-anchor="middle">Raster residual PNG</text>
  <text x="240" y="236" text-anchor="middle" font-size="12" fill="#555">faithful at reading zoom</text>
  <text x="240" y="252" text-anchor="middle" font-size="12" fill="#a33">grey blur at high zoom</text>
  <g transform="translate(150 320)">
    <text x="0" y="0" font-size="12" fill="#555">Sub-pixel handwriting at 8x</text>
    <path d="M0 40 C20 10 40 10 60 34 S100 50 120 24 S160 10 180 34" stroke="#999" stroke-opacity="0.35" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M0 40 C20 10 40 10 60 34 S100 50 120 24 S160 10 180 34" stroke="#777" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- After -->
  <g stroke="#444" stroke-width="1.5" fill="none">
    <rect x="570" y="64" width="300" height="64" rx="8" fill="#fff7e0"/>
    <rect x="520" y="190" width="170" height="104" rx="8" fill="#eef4ff"/>
    <rect x="720" y="190" width="200" height="104" rx="8" fill="#eaf7ea"/>
    <rect x="570" y="360" width="300" height="72" rx="8" fill="#f3f3f3"/>
    <path d="M680 128 L610 186" marker-end="url(#arrow)"/>
    <path d="M760 128 L820 186" marker-end="url(#arrow)"/>
    <path d="M605 294 L680 356" marker-end="url(#arrow)"/>
    <path d="M820 294 L760 356" marker-end="url(#arrow)"/>
  </g>
  <text x="720" y="90" text-anchor="middle">Untraceable component</text>
  <text x="720" y="110" text-anchor="middle" font-size="12" fill="#555">Factory.Vectorize: at half its own peak</text>
  <text x="605" y="214" text-anchor="middle">Reconstructed</text>
  <text x="605" y="232" text-anchor="middle" font-size="12" fill="#555">narrow, one color,</text>
  <text x="605" y="248" text-anchor="middle" font-size="12" fill="#555">peak &#8805; 48</text>
  <text x="605" y="266" text-anchor="middle" font-size="12" fill="#555">field / local max,</text>
  <text x="605" y="282" text-anchor="middle" font-size="12" fill="#555">contour at 0.6</text>
  <text x="820" y="214" text-anchor="middle">Raster residual</text>
  <text x="820" y="232" text-anchor="middle" font-size="12" fill="#555">wide translucent,</text>
  <text x="820" y="248" text-anchor="middle" font-size="12" fill="#555">faint, or multicolor</text>
  <text x="820" y="266" text-anchor="middle" font-size="12" fill="#555">unchanged PNG</text>
  <text x="720" y="386" text-anchor="middle">One vector node, then residual image</text>
  <text x="720" y="406" text-anchor="middle" font-size="12" fill="#555">opaque bounded cubic curves; same placement</text>
  <text x="720" y="422" text-anchor="middle" font-size="12" fill="#555">schema and runtime unchanged</text>

  <g transform="translate(630 470)">
    <text x="0" y="0" font-size="12" fill="#555">Same handwriting at 8x</text>
    <path d="M0 40 C20 10 40 10 60 34 S100 50 120 24 S160 10 180 34" stroke="#000" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
