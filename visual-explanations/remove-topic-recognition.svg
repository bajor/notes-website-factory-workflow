<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">Topic recognition removal flow</title>
  <desc id="desc">The factory now parses one PDF into source-derived scene data and assets, then emits a viewer with Fit and direct navigation. OCR, topic detection, metadata, and topic controls are absent.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#1c1917}.box{fill:#f5f5f4;stroke:#44403c;stroke-width:2}.removed{fill:#fef2f2;stroke:#b91c1c;stroke-width:2;stroke-dasharray:7 5}.line{stroke:#44403c;stroke-width:3;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#44403c"/></marker></defs>
  <rect class="box" x="30" y="80" width="180" height="70" rx="12"/><text x="120" y="110" text-anchor="middle" font-size="18">One-page PDF</text><text x="120" y="134" text-anchor="middle" font-size="14">consumer input</text>
  <line class="line" x1="210" y1="115" x2="300" y2="115"/>
  <rect class="box" x="300" y="80" width="210" height="70" rx="12"/><text x="405" y="110" text-anchor="middle" font-size="18">Parse and validate</text><text x="405" y="134" text-anchor="middle" font-size="14">nodes and assets</text>
  <line class="line" x1="510" y1="115" x2="600" y2="115"/>
  <rect class="box" x="600" y="80" width="290" height="70" rx="12"/><text x="745" y="110" text-anchor="middle" font-size="18">Static viewer</text><text x="745" y="134" text-anchor="middle" font-size="14">Fit and direct navigation</text>
  <rect class="removed" x="278" y="175" width="360" height="30" rx="8"/><text x="458" y="196" text-anchor="middle" font-size="14">Removed: detection, OCR, metadata, Topics UI</text>
</svg>
